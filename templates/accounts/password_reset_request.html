{% extends "base.html" %}
{% block title %}Mot de passe oublié — GeoPresence{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-5">
        <h1 class="h4 mb-3">Mot de passe oublié</h1>
        <p class="text-muted">Indiquez votre e-mail : si un compte existe, un lien de réinitialisation vous sera envoyé.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.email.id_for_label }}" class="form-label">{{ form.email.label }}</label>
                {{ form.email }}
            </div>
            <button type="submit" class="btn btn-primary w-100">Envoyer le lien</button>
        </form>
        <div class="mt-3 text-center">
            <a href="{% url 'accounts:login' %}">Retour à la connexion</a>
        </div>
    </div>
</div>
{% endblock %}
