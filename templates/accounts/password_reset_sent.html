{% extends "base.html" %}
{% block title %}Lien envoyé — GeoPresence{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6">
        <div class="alert alert-info">
            Si un compte existe avec cette adresse, un e-mail contenant un lien de réinitialisation vient d'être envoyé.
            Le lien expire dans 30 minutes.
        </div>
        <a href="{% url 'accounts:login' %}">Retour à la connexion</a>
    </div>
</div>
{% endblock %}
