<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hors ligne — GeoPresence</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0A1E45; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    text-align: center; padding: 2rem;
  }
  .box { max-width: 360px; }
  h1 { font-size: 1.3rem; margin-bottom: 0.75rem; }
  p { color: rgba(255,255,255,0.72); font-size: 0.95rem; line-height: 1.5; }
  button {
    margin-top: 1.5rem; background: #0B63F6; color: #fff; border: none; border-radius: 8px;
    padding: 0.65rem 1.4rem; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Vous êtes hors ligne</h1>
    <p>Cette page n'est pas disponible sans connexion pour le moment. Si vous étiez en train de pointer, votre appareil réessaiera automatiquement dès que le réseau reviendra.</p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
